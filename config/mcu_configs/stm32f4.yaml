mcu_family: "STM32F4"
core: "Cortex-M4"
flash_size: 1024K
ram_size: 192K
clock_speed: 168MHz
peripherals:
  uart:
    - UART1
    - UART2
    - UART3
  spi:
    - SPI1
    - SPI2
  i2c:
    - I2C1
    - I2C2
  timers:
    - TIM1
    - TIM2
    - TIM3
compiler_flags:
  cpu: cortex-m4
  fpu: fpv4-sp-d16
  float-abi: hard
  defines:
    - STM32F407xx
    - USE_HAL_DRIVER